name: "trivy"
command: "trivy"
enabled: true
short_description: "Scan container images, filesystems, repositories and configuration for vulnerabilities"
description: |
  Scan container images, filesystems, repositories and configuration for vulnerabilities.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "scan_type"
    type: "string"
    description: "Native scan mode. Default: image."
    required: false
    default: "image"
    position: 0
    format: "positional"
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool."
    required: true
    position: 1
    format: "positional"
  - name: "severity"
    type: "string"
    description: "Severity filter. Native option: --severity."
    required: false
    flag: "--severity"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format. Native option: --format. Default: json."
    required: false
    flag: "--format"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
