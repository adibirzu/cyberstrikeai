name: "gau"
command: "gau"
enabled: true
short_description: "Collect known URLs from public archive and intelligence sources"
description: |
  Collect known URLs from public archive and intelligence sources.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name."
    required: true
    position: 0
    format: "positional"
  - name: "providers"
    type: "string"
    description: "Comma-separated URL data sources, such as wayback, commoncrawl, otx or urlscan. Native option: --providers."
    required: false
    flag: "--providers"
    format: "flag"
  - name: "include_subs"
    type: "bool"
    description: "Include subdomains. Native option: --subs. Default: true."
    required: false
    flag: "--subs"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
