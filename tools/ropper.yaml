name: "ropper"
command: "ropper"
enabled: true
short_description: "Search binaries for ROP and JOP gadgets"
description: |
  Search binaries for ROP and JOP gadgets.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file. Native option: --file."
    required: true
    flag: "--file"
    format: "flag"
  - name: "gadget_type"
    type: "string"
    description: "Gadget class. Native option: --type. Default: rop."
    required: false
    flag: "--type"
    format: "flag"
    default: "rop"
  - name: "quality"
    type: "int"
    description: "Native gadget quality level. Native option: --quality. Default: 1."
    required: false
    flag: "--quality"
    format: "flag"
    default: 1
  - name: "arch"
    type: "string"
    description: "Target architecture. Native option: --arch."
    required: false
    flag: "--arch"
    format: "flag"
  - name: "search_string"
    type: "string"
    description: "Gadget search expression. Native option: --search."
    required: false
    flag: "--search"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
