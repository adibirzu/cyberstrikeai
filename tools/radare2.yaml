name: "radare2"
command: "r2"
enabled: true
short_description: "Analyze, disassemble and debug binaries with Radare2"
description: |
  Analyze, disassemble and debug binaries with Radare2.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool."
    required: true
    position: 1
    format: "positional"
  - name: "commands"
    type: "string"
    description: "Native commands to execute. Native option: -c."
    required: false
    flag: "-c"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: "Path to a script file. Native option: -i."
    required: false
    flag: "-i"
    format: "flag"
  - name: "arch"
    type: "string"
    description: "Target architecture. Native option: -a."
    required: false
    flag: "-a"
    format: "flag"
  - name: "bits"
    type: "int"
    description: "Target bit width. Native option: -b."
    required: false
    flag: "-b"
    format: "flag"
  - name: "auto_analyze"
    type: "bool"
    description: "Run automatic binary analysis (Radare2 aaa). Native option: -A. Default: false."
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "debug"
    type: "bool"
    description: "Enable native debugging mode; may attach to a process. Native option: -d. Default: false."
    required: false
    flag: "-d"
    format: "flag"
    default: false
  - name: "quiet"
    type: "bool"
    description: "Suppress startup messages and prompts. Native option: -q. Default: false."
    required: false
    flag: "-q"
    format: "flag"
    default: false
  - name: "seek"
    type: "string"
    description: "Starting address or expression, for example 0x400000 or main+0x10. Native option: -s."
    required: false
    flag: "-s"
    format: "flag"
  - name: "base_address"
    type: "string"
    description: "Binary load base address, for example 0x400000. Native option: -B."
    required: false
    flag: "-B"
    format: "flag"
  - name: "eval"
    type: "string"
    description: "Configuration assignments in key=value form. Native option: -e."
    required: false
    flag: "-e"
    format: "flag"
  - name: "project"
    type: "string"
    description: "Path or name of the native analysis project. Native option: -p."
    required: false
    flag: "-p"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
