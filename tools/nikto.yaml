name: "nikto"
command: "nikto"
enabled: true
# 允许的退出码列表：nikto在找到漏洞时会返回退出码1，这是正常的成功状态
allowed_exit_codes: [1]
# 简短描述（用于工具列表，减少token消耗）
short_description: "Check web servers for known vulnerabilities and configuration issues"
# 工具详细描述
description: |
  Check web servers for known vulnerabilities and configuration issues.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
# 参数定义
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool. Native option: -h."
    required: true
    flag: "-h"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
