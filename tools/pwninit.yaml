name: "pwninit"
command: "pwninit"
enabled: true
short_description: "Prepare a binary exploitation environment with matching libc and loader"
description: |
  Prepare a binary exploitation environment with matching libc and loader.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file."
    required: true
    position: 0
    format: "positional"
  - name: "libc"
    type: "string"
    description: "Path to the libc file. Native option: --libc."
    required: false
    flag: "--libc"
    format: "flag"
  - name: "ld"
    type: "string"
    description: "Path to the dynamic loader. Native option: --ld."
    required: false
    flag: "--ld"
    format: "flag"
  - name: "template_type"
    type: "string"
    description: "Template format or language. Native option: --template. Default: python."
    required: false
    flag: "--template"
    format: "flag"
    default: "python"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
