name: "terrascan"
command: "terrascan"
enabled: true
short_description: "Scan infrastructure-as-code for security policy violations"
description: |
  Scan infrastructure-as-code for security policy violations.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "scan_type"
    type: "string"
    description: "Native scan mode. Native option: --scan-type. Default: all."
    required: false
    flag: "--scan-type"
    format: "flag"
    default: "all"
  - name: "iac_dir"
    type: "string"
    description: "Infrastructure-as-code directory. Native option: -d. Default: .."
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "policy_type"
    type: "string"
    description: "Policy set/type. Native option: --policy-type."
    required: false
    flag: "--policy-type"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format. Native option: --output. Default: json."
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "severity"
    type: "string"
    description: "Severity filter. Native option: --severity."
    required: false
    flag: "--severity"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
