name: "steghide"
command: "steghide"
enabled: true
short_description: "Inspect, embed or extract steganographic data"
description: |
  Inspect, embed or extract steganographic data.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "action"
    type: "string"
    description: "Operation to perform."
    required: true
    position: 0
    format: "positional"
  - name: "cover_file"
    type: "string"
    description: "Carrier file path for embed/info operations (-cf). Native option: -cf."
    required: false
    flag: "-cf"
    format: "flag"
  - name: "embed_file"
    type: "string"
    description: "Path to the file to embed. Native option: -ef."
    required: false
    flag: "-ef"
    format: "flag"
  - name: "passphrase"
    type: "string"
    description: "Passphrase for embedding or extraction. Native option: -p."
    required: false
    flag: "-p"
    format: "flag"
  - name: "stego_file"
    type: "string"
    description: "Steganographic file path: output for embed, input for extract. Native option: -sf."
    required: false
    flag: "-sf"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
