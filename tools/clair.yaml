name: "clair"
command: "clair"
enabled: false
short_description: "Analyze container images for vulnerabilities"
description: |
  Analyze container images for vulnerabilities.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "image"
    type: "string"
    description: "Container image reference to scan. Native option: --image."
    required: true
    flag: "--image"
    format: "flag"
  - name: "config"
    type: "string"
    description: "Path to the configuration file. Native option: --config. Default: /etc/clair/config.yaml."
    required: false
    flag: "--config"
    format: "flag"
    default: "/etc/clair/config.yaml"
  - name: "output_format"
    type: "string"
    description: "Output format. Native option: --format. Default: json."
    required: false
    flag: "--format"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
