name: "one-gadget"
command: "one_gadget"
enabled: true
short_description: "Find candidate one-shot execution gadgets in libc"
description: |
  Find candidate one-shot execution gadgets in libc.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "libc_path"
    type: "string"
    description: "Path to the libc binary."
    required: true
    position: 0
    format: "positional"
  - name: "level"
    type: "int"
    description: "Native test or analysis level. Native option: -l. Default: 1."
    required: false
    flag: "-l"
    format: "flag"
    default: 1
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
