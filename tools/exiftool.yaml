name: "exiftool"
command: "exiftool"
enabled: true
short_description: "Extract file metadata"
description: |
  Extract file metadata.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the input file."
    required: true
    position: 0
    format: "positional"
  - name: "output_json"
    type: "bool"
    description: "Use JSON output. Native option: -json. Default: false."
    required: false
    flag: "-json"
    format: "flag"
    default: false
  - name: "output_xml"
    type: "bool"
    description: "Use XML output. Native option: -X. Default: false."
    required: false
    flag: "-X"
    format: "flag"
    default: false
  - name: "output_csv"
    type: "bool"
    description: "Use CSV output. Native option: -csv. Default: false."
    required: false
    flag: "-csv"
    format: "flag"
    default: false
  - name: "tags"
    type: "string"
    description: "Tags to select."
    required: false
    format: "template"
    template: "-{value}"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
