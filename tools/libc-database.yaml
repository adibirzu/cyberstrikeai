name: "libc-database"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write('Missing action (find/dump/download)\n')
        sys.exit(1)

    action = sys.argv[1]
    symbols = sys.argv[2] if len(sys.argv) > 2 else ""
    libc_id = sys.argv[3] if len(sys.argv) > 3 else ""
    extra = sys.argv[4] if len(sys.argv) > 4 else ""

    cmd = ["libc-database", action]

    if symbols:
        cmd.extend(shlex.split(symbols))

    if libc_id:
        cmd.append(libc_id)

    if extra:
        cmd.extend(shlex.split(extra))

    proc = subprocess.run(cmd, capture_output=True, text=True)
    if proc.stdout:
        sys.stdout.write(proc.stdout)
    if proc.stderr:
        sys.stderr.write(proc.stderr)
    sys.exit(proc.returncode)
enabled: true
short_description: "Identify libc versions and inspect symbol offsets"
description: |
  Identify libc versions and inspect symbol offsets.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "action"
    type: "string"
    description: "Operation to perform."
    required: true
    position: 0
    format: "positional"
  - name: "symbols"
    type: "string"
    description: "Symbol:offset pairs separated by spaces, for example symbol1:offset1 symbol2:offset2. Default: ."
    required: false
    default: ""
    position: 1
    format: "positional"
  - name: "libc_id"
    type: "string"
    description: "libc database identifier for dump/download. Default: ."
    required: false
    default: ""
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe. Default: ."
    required: false
    default: ""
    position: 3
    format: "positional"
