name: "gobuster"
command: "gobuster"
enabled: false
short_description: "Discover web content, DNS names and virtual hosts"
description: |
  Discover web content, DNS names and virtual hosts.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "mode"
    type: "string"
    description: "Native operating mode. Allowed values: dir, dns, fuzz, vhost. Default: dir."
    required: false
    default: "dir"
    position: 0
    format: "positional"
    options: ["dir", "dns", "fuzz", "vhost"]
  - name: "url"
    type: "string"
    description: "Target URL. Native option: -u."
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Path to the wordlist file. Native option: -w. Default: /usr/share/wordlists/dirb/common.txt."
    required: false
    default: "/usr/share/wordlists/dirb/common.txt"
    flag: "-w"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
