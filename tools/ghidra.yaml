name: "ghidra"
command: "analyzeHeadless"
enabled: true
short_description: "Analyze binaries with Ghidra headless tools"
description: |
  Analyze binaries with Ghidra headless tools.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "project_dir"
    type: "string"
    description: "Project directory. Default: /tmp/ghidra_projects."
    required: false
    default: "/tmp/ghidra_projects"
    position: 0
    format: "positional"
  - name: "project_name"
    type: "string"
    description: "Project name. Default: cyberstrike_analysis."
    required: false
    default: "cyberstrike_analysis"
    position: 1
    format: "positional"
  - name: "binary"
    type: "string"
    description: "Path to the binary file. Native option: -import."
    required: true
    flag: "-import"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: "Path to a script file. Native option: -postScript."
    required: false
    flag: "-postScript"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
