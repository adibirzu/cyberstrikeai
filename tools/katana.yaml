name: "katana"
command: "katana"
enabled: true
short_description: "Crawl web applications and discover endpoints"
description: |
  Crawl web applications and discover endpoints.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "url"
    type: "string"
    description: "Target URL. Native option: -u."
    required: true
    flag: "-u"
    format: "flag"
  - name: "depth"
    type: "int"
    description: "Maximum crawl depth. Native option: -d. Default: 3."
    required: false
    flag: "-d"
    format: "flag"
    default: 3
  - name: "js_crawl"
    type: "bool"
    description: "Enable JavaScript crawling. Native option: -jc. Default: true."
    required: false
    flag: "-jc"
    format: "flag"
    default: true
  - name: "form_extraction"
    type: "bool"
    description: "Extract HTML form fields. Native option: -fx. Default: true."
    required: false
    flag: "-fx"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
