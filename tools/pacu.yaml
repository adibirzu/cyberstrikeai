name: "pacu"
command: "pacu"
enabled: false
short_description: "Run AWS security-assessment modules with Pacu"
description: |
  Run AWS security-assessment modules with Pacu.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "session_name"
    type: "string"
    description: "Pacu session name. Native option: --session. Default: hexstrike_session."
    required: false
    flag: "--session"
    format: "flag"
    default: "hexstrike_session"
  - name: "modules"
    type: "string"
    description: "Comma-separated native module names. Native option: --modules."
    required: false
    flag: "--modules"
    format: "flag"
  - name: "regions"
    type: "string"
    description: "Comma-separated cloud regions. Native option: --regions."
    required: false
    flag: "--regions"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
