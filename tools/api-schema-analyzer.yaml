name: "api-schema-analyzer"
command: "spectral"
args: ["lint"]
enabled: true
short_description: "Analyze API schemas with Spectral for validation and security issues"
description: |
  Analyze API schemas with Spectral for validation and security issues.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "schema_url"
    type: "string"
    description: "API schema file path or URL passed to spectral lint."
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
