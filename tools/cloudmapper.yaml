name: "cloudmapper"
command: "cloudmapper"
enabled: true
short_description: "Collect and visualize AWS network and security configuration"
description: |
  Collect and visualize AWS network and security configuration.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "action"
    type: "string"
    description: "Operation to perform. Default: collect."
    required: false
    default: "collect"
    position: 0
    format: "positional"
  - name: "account"
    type: "string"
    description: "Cloud account name or identifier to analyze. Native option: --account."
    required: false
    flag: "--account"
    format: "flag"
  - name: "config"
    type: "string"
    description: "Path to the configuration file. Native option: --config. Default: config.json."
    required: false
    flag: "--config"
    format: "flag"
    default: "config.json"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
