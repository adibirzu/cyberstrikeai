name: "x8"
command: "x8"
enabled: true
short_description: "Discover hidden HTTP parameters"
description: |
  Discover hidden HTTP parameters.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "url"
    type: "string"
    description: "Target URL. Native option: --url."
    required: true
    flag: "--url"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Path to the wordlist file. Native option: --wordlist. Default: /usr/share/wordlists/x8/params.txt."
    required: false
    flag: "--wordlist"
    format: "flag"
    default: "/usr/share/wordlists/x8/params.txt"
  - name: "method"
    type: "string"
    description: "HTTP request method. Native option: --method. Default: get."
    required: false
    flag: "--method"
    format: "flag"
    default: "GET"
  - name: "body"
    type: "string"
    description: "HTTP request body. Native option: --body."
    required: false
    flag: "--body"
    format: "flag"
  - name: "headers"
    type: "string"
    description: "Custom HTTP request headers. Native option: --headers."
    required: false
    flag: "--headers"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
