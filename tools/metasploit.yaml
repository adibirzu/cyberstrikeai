name: "metasploit"
command: "python3"
args:
  - "-c"
  - |
    import json
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write('Missing module name\n')
        sys.exit(1)

    module = sys.argv[1]
    options_raw = sys.argv[2] if len(sys.argv) > 2 else "{}"
    extra = sys.argv[3] if len(sys.argv) > 3 else ""

    try:
        options = json.loads(options_raw) if options_raw else {}
    except json.JSONDecodeError as exc:
        sys.stderr.write(f"Option parsing failed: {exc}\n")
        sys.exit(1)

    commands = [f"use {module}"]
    for key, value in options.items():
        commands.append(f"set {key} {value}")
    commands.append("run")
    commands.append("exit")

    cmd = ["msfconsole", "-q", "-x", "; ".join(commands)]
    if extra:
        cmd.extend(shlex.split(extra))

    subprocess.run(cmd, check=False)
enabled: true
short_description: "Run a selected Metasploit module with explicit options"
description: |
  Run a selected Metasploit module with explicit options.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "module"
    type: "string"
    description: "Native module to run."
    required: true
    position: 0
    format: "positional"
  - name: "options"
    type: "string"
    description: "Module options as a JSON object; keys correspond to native set commands. Default: {}."
    required: false
    default: "{}"
    position: 1
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe. Default: ."
    required: false
    default: ""
    position: 2
    format: "positional"
