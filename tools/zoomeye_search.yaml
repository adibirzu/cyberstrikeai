name: "zoomeye_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import requests
    import os

    # ==================== ZoomEye配置 ====================
    # 请在此处配置您的ZoomEye账号信息
    # 您也可以在环境变量中设置：ZOOMEYE_API_KEY
    # enable 默认为 false，需开启才能调用该MCP
    ZOOMEYE_API_KEY = ""  # 请填写您的ZoomEye API密钥
    # ==================================================

    # ZoomEye API基础URL
    base_url = "https://api.zoomeye.ai/v2/search"

    # 解析参数（从JSON字符串或命令行参数）
    def parse_args():
        # 尝试从第一个参数读取JSON配置
        if len(sys.argv) > 1:
            try:
                # 确保 sys.argv[1] 是字符串
                arg1 = str(sys.argv[1])
                # 尝试解析为JSON
                config = json.loads(arg1)
                # 确保返回的是字典类型
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                # 如果不是JSON，使用传统的位置参数方式
                pass

        # 传统位置参数方式（向后兼容）
        # 参数位置：query=1, page=2, pagesize=3, fields=4, sub_type=5
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['page'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['pagesize'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            config['sub_type'] = str(sys.argv[5])
        return config

    try:
        config = parse_args()

        # 确保 config 是字典类型
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Invalid parameters: expected an object, got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # 从配置或环境变量获取api_key
        api_key = os.getenv('ZOOMEYE_API_KEY', ZOOMEYE_API_KEY).strip()
        query = config.get('query', '').strip()

        if not api_key:
            error_result = {
                "status": "error",
                "message": 'Missing ZoomEye configuration: api_key',
                "required_config": ["api_key"],
                "note": "Set ZOOMEYE_API_KEY in this recipe or its explicitly configured child environment. Obtain a key from https://www.zoomeye.ai/user"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": 'Missing required parameter: query (search expression)',
                "required_params": ["query"],
                "examples": [
                    'app:"Apache"',
                    'title:"Login"',
                    'domain:"example.com"',
                    'ip:"1.1.1.1"',
                    'port:80',
                    'country:"CN"',
                    'city:"Beijing"'
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # 构建请求参数（ZoomEye API 使用 POST 请求，参数在请求体中）
        # ZoomEye API 使用 qbase64 参数（base64编码的查询）
        data = {
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }

        # 可选参数
        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    data['page'] = page
            except (ValueError, TypeError):
                pass

        if 'pagesize' in config and config['pagesize'] is not None:
            try:
                pagesize = int(config['pagesize'])
                if pagesize > 0 and pagesize <= 10000:
                    data['pagesize'] = pagesize
            except (ValueError, TypeError):
                pass

        if 'fields' in config and config['fields']:
            data['fields'] = str(config['fields']).strip()

        if 'sub_type' in config and config['sub_type']:
            sub_type = str(config['sub_type']).strip().lower()
            if sub_type in ('v4', 'v6', 'web'):
                data['sub_type'] = sub_type

        if 'facets' in config and config['facets']:
            data['facets'] = str(config['facets']).strip()

        if 'ignore_cache' in config and config['ignore_cache'] is not None:
            ignore_cache_val = config['ignore_cache']
            if isinstance(ignore_cache_val, bool):
                data['ignore_cache'] = ignore_cache_val
            elif isinstance(ignore_cache_val, str):
                data['ignore_cache'] = ignore_cache_val.lower() in ('true', '1', 'yes')
            elif isinstance(ignore_cache_val, (int, float)):
                data['ignore_cache'] = ignore_cache_val != 0

        # 设置请求头（ZoomEye API 使用 API Key 认证）
        headers = {
            'API-KEY': api_key,
            'Content-Type': 'application/json'
        }

        # 发送请求（ZoomEye API 使用 POST 方法）
        try:
            response = requests.post(base_url, json=data, headers=headers, timeout=30)
            response.raise_for_status()

            result_data = response.json()

            # 检查ZoomEye API返回的错误
            # ZoomEye API 成功时 code 为 60000
            if result_data.get('code') != 60000:
                error_code = result_data.get('code', 'unknown')
                error_msg = result_data.get('message', 'Unknown error')
                error_result = {
                    "status": "error",
                    "message": f"ZoomEye API Error: {error_msg}",
                    "error_code": error_code,
                    "suggestion": 'Check the API key and ZoomEye query syntax.'
                }
                print(json.dumps(error_result, ensure_ascii=False, indent=2))
                sys.exit(1)

            # 格式化输出结果
            # ZoomEye API 返回的数据在 data 字段中
            data_list = result_data.get('data', [])
            if isinstance(data_list, dict):
                nested = None
                for key in ('data', 'items', 'matches', 'results', 'list', 'records'):
                    value = data_list.get(key)
                    if isinstance(value, list):
                        nested = value
                        break
                data_list = nested if nested is not None else []
            if not isinstance(data_list, list):
                data_list = []
            output = {
                "status": "success",
                "query": result_data.get('query', query),
                "total": result_data.get('total', 0),
                "page": result_data.get('page', 1),
                "pagesize": result_data.get('pagesize', 10),
                "results_count": len(data_list),
                "results": data_list,
                "message": f"Retrieved {len(data_list)} results"
            }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            error_result = {
                "status": "error",
                "message": f"Request failed: {str(e)}",
                "suggestion": 'Check the network connection or ZoomEye API Service Status'
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution failed: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: false
short_description: "Search ZoomEye internet asset records"
description: |
  Search ZoomEye internet asset records.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "query"
    type: "string"
    description: "Search query in the selected provider syntax."
    required: true
    position: 1
    format: "positional"
  - name: "page"
    type: "int"
    description: "Page number. Default: 1."
    required: false
    position: 2
    format: "positional"
    default: 1
  - name: "pagesize"
    type: "int"
    description: "Results per page. Default: 5."
    required: false
    position: 3
    format: "positional"
    default: 5
  - name: "fields"
    type: "string"
    description: "Fields to include in the response. Default: ip,port,domain,update_time."
    required: false
    position: 4
    format: "positional"
    default: "ip,port,domain,update_time"
  - name: "sub_type"
    type: "string"
    description: "Provider data subtype. Default: v4."
    required: false
    position: 5
    format: "positional"
    default: "v4"
  - name: "facets"
    type: "string"
    description: "Provider aggregation fields."
    required: false
    position: 6
    format: "positional"
  - name: "ignore_cache"
    type: "bool"
    description: "Bypass the provider cache. Default: false."
    required: false
    position: 7
    format: "positional"
    default: false
