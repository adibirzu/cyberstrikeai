name: "fscan"
command: "fscan"
enabled: false
short_description: "Scan internal networks for hosts, ports, services and supported security checks"
description: |
  Scan internal networks for hosts, ports, services and supported security checks.

  Supports discovery, service checks, optional authentication testing, custom PoCs and explicitly requested callback/download actions. Keep concurrency/rate settings within the engagement limits. English output is selected by default.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool. Native option: -h."
    required: true
    flag: "-h"
    format: "flag"
  - name: "ports"
    type: "string"
    description: "Ports to scan. Native option: -p. Default: 21,22,23,25,53,80,81,88,110,111,135,139,143,161,389,443,445,465,502,512,513,514,515,548,554,587,623,636,873,902,993,995,1080,1099,1194,1433,1434,1521,1522,1525,1723,1883,2049,2121,2181,2200,2222,2375,2376,2379,2380,3000,3128,3268,3269,3306,3389,3690,4369,4444,4848,5000,5005,5044,5060,5432,5601,5631,5632,5671,5672,5900,5984,5985,5986,6000,6379,6380,6443,6666,6667,7001,7002,7474,7687,8000,8005,8008,8009,8080,8081,8086,8088,8089,8090,8161,8180,8443,8500,8834,8848,8880,8888,9000,9001,9042,9080,9090,9092,9093,9160,9200,9300,9418,9443,9999,10000,10051,10250,10255,11211,15672,22222,26379,27017,27018,50000,50070,50075,61613,61614,61616."
    required: false
    flag: "-p"
    format: "flag"
    default: "21,22,23,25,53,80,81,88,110,111,135,139,143,161,389,443,445,465,502,512,513,514,515,548,554,587,623,636,873,902,993,995,1080,1099,1194,1433,1434,1521,1522,1525,1723,1883,2049,2121,2181,2200,2222,2375,2376,2379,2380,3000,3128,3268,3269,3306,3389,3690,4369,4444,4848,5000,5005,5044,5060,5432,5601,5631,5632,5671,5672,5900,5984,5985,5986,6000,6379,6380,6443,6666,6667,7001,7002,7474,7687,8000,8005,8008,8009,8080,8081,8086,8088,8089,8090,8161,8180,8443,8500,8834,8848,8880,8888,9000,9001,9042,9080,9090,9092,9093,9160,9200,9300,9418,9443,9999,10000,10051,10250,10255,11211,15672,22222,26379,27017,27018,50000,50070,50075,61613,61614,61616"
  - name: "mode"
    type: "string"
    description: "Native operating mode. Native option: -m. Default: all."
    required: false
    flag: "-m"
    format: "flag"
    default: "all"
  - name: "output_file"
    type: "string"
    description: "Path for the output file. Native option: -o. Default: result.txt."
    required: false
    flag: "-o"
    format: "flag"
    default: "result.txt"
  - name: "output_format"
    type: "string"
    description: "Output format. Native option: -f. Default: txt."
    required: false
    flag: "-f"
    format: "flag"
    default: "txt"
  - name: "threads"
    type: "int"
    description: "Number of concurrent worker threads. Native option: -t. Default: 600."
    required: false
    flag: "-t"
    format: "flag"
    default: 600
  - name: "module_threads"
    type: "int"
    description: "Number of concurrent scan modules. Native option: -mt. Default: 20."
    required: false
    flag: "-mt"
    format: "flag"
    default: 20
  - name: "poc_num"
    type: "int"
    description: "Number of concurrent PoC checks. Native option: -num. Default: 20."
    required: false
    flag: "-num"
    format: "flag"
    default: 20
  - name: "timeout"
    type: "int"
    description: "Timeout in seconds. Native option: -time. Default: 3."
    required: false
    flag: "-time"
    format: "flag"
    default: 3
  - name: "web_timeout"
    type: "int"
    description: "Web request timeout in seconds. Native option: -wt. Default: 5."
    required: false
    flag: "-wt"
    format: "flag"
    default: 5
  - name: "global_timeout"
    type: "int"
    description: "Overall timeout in seconds. Native option: -gt. Default: 180."
    required: false
    flag: "-gt"
    format: "flag"
    default: 180
  - name: "url"
    type: "string"
    description: "Target URL. Native option: -u."
    required: false
    flag: "-u"
    format: "flag"
  - name: "proxy"
    type: "string"
    description: "Proxy URL. Native option: -proxy."
    required: false
    flag: "-proxy"
    format: "flag"
  - name: "socks5"
    type: "string"
    description: "SOCKS5 proxy address. Native option: -socks5."
    required: false
    flag: "-socks5"
    format: "flag"
  - name: "cookie"
    type: "string"
    description: "HTTP Cookie header value. Native option: -cookie."
    required: false
    flag: "-cookie"
    format: "flag"
  - name: "domain"
    type: "string"
    description: "Target domain name. Native option: -domain."
    required: false
    flag: "-domain"
    format: "flag"
  - name: "username"
    type: "string"
    description: "Username for authorized authentication tests. Native option: -user."
    required: false
    flag: "-user"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Password for authorized authentication tests. Native option: -pwd."
    required: false
    flag: "-pwd"
    format: "flag"
  - name: "user_file"
    type: "string"
    description: "Path to the username wordlist. Native option: -userf."
    required: false
    flag: "-userf"
    format: "flag"
  - name: "pass_file"
    type: "string"
    description: "Path to the password wordlist. Native option: -pwdf."
    required: false
    flag: "-pwdf"
    format: "flag"
  - name: "host_file"
    type: "string"
    description: "File containing one target host/IP per line. Native option: -hf."
    required: false
    flag: "-hf"
    format: "flag"
  - name: "port_file"
    type: "string"
    description: "File containing the port selection. Native option: -pf."
    required: false
    flag: "-pf"
    format: "flag"
  - name: "url_file"
    type: "string"
    description: "File containing target URLs. Native option: -uf."
    required: false
    flag: "-uf"
    format: "flag"
  - name: "pocname"
    type: "string"
    description: "Name of the PoC check to run. Native option: -pocname."
    required: false
    flag: "-pocname"
    format: "flag"
  - name: "pocpath"
    type: "string"
    description: "Path to custom PoC checks. Native option: -pocpath."
    required: false
    flag: "-pocpath"
    format: "flag"
  - name: "iface"
    type: "string"
    description: "Local interface IP address, for example on a VPN. Native option: -iface."
    required: false
    flag: "-iface"
    format: "flag"
  - name: "exclude_host"
    type: "string"
    description: "Hosts to exclude from scanning. Native option: -eh."
    required: false
    flag: "-eh"
    format: "flag"
  - name: "exclude_port"
    type: "string"
    description: "Ports to exclude from scanning. Native option: -ep."
    required: false
    flag: "-ep"
    format: "flag"
  - name: "retry"
    type: "int"
    description: "Maximum retry count. Native option: -retry. Default: 3."
    required: false
    flag: "-retry"
    format: "flag"
    default: 3
  - name: "rate_limit"
    type: "int"
    description: "Maximum packets/requests per minute; 0 disables this limit. Native option: -rate."
    required: false
    flag: "-rate"
    format: "flag"
  - name: "max_redirect"
    type: "int"
    description: "Maximum HTTP redirects. Native option: -max-redirect. Default: 10."
    required: false
    flag: "-max-redirect"
    format: "flag"
    default: 10
  - name: "lang"
    type: "string"
    description: "Output language: en (English, default) or zh (Chinese). Native option: -lang. Default: en."
    required: false
    flag: "-lang"
    format: "flag"
    default: "en"
  - name: "log_level"
    type: "string"
    description: "Log verbosity or selected log categories. Native option: -log. Default: base,info,success."
    required: false
    flag: "-log"
    format: "flag"
    default: "base,info,success"
  - name: "reverse_shell"
    type: "string"
    description: "Callback host:port for an explicitly authorized reverse shell. Native option: -rsh."
    required: false
    flag: "-rsh"
    format: "flag"
  - name: "sshkey_file"
    type: "string"
    description: "Path to an explicitly authorized SSH private key. Native option: -sshkey."
    required: false
    flag: "-sshkey"
    format: "flag"
  - name: "download_url"
    type: "string"
    description: "URL of the file to download. Native option: -download-url."
    required: false
    flag: "-download-url"
    format: "flag"
  - name: "download_path"
    type: "string"
    description: "Destination path for the download. Native option: -download-path."
    required: false
    flag: "-download-path"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
