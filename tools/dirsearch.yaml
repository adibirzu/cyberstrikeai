name: "dirsearch"
command: "dirsearch"
enabled: true
short_description: "Discover web directories and files"
description: |
  Discover web directories and files.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "url"
    type: "string"
    description: "Target URL. Native option: -u."
    required: true
    flag: "-u"
    format: "flag"
  - name: "extensions"
    type: "string"
    description: "Comma-separated file extensions. Native option: -e. Default: php,html,js,txt,xml,json."
    required: false
    flag: "-e"
    format: "flag"
    default: "php,html,js,txt,xml,json"
  - name: "wordlist"
    type: "string"
    description: "Path to the wordlist file. Native option: -w."
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of concurrent worker threads. Native option: -t. Default: 30."
    required: false
    flag: "-t"
    format: "flag"
    default: 30
  - name: "recursive"
    type: "bool"
    description: "Enable recursive discovery. Native option: -r. Default: false."
    required: false
    flag: "-r"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
