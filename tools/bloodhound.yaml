name: "bloodhound"
command: "bloodhound-python"
enabled: true
short_description: "Collect Active Directory relationship data for BloodHound analysis"
description: |
  Collect Active Directory relationship data for BloodHound analysis.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name. Native option: -d."
    required: false
    flag: "-d"
    format: "flag"
  - name: "username"
    type: "string"
    description: "Username to use. Native option: -u."
    required: false
    flag: "-u"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Password to use. Native option: -p."
    required: false
    flag: "-p"
    format: "flag"
  - name: "collection_method"
    type: "string"
    description: "Active Directory collection methods. Native option: -c. Default: all."
    required: false
    default: "All"
    flag: "-c"
    format: "flag"
  - name: "dc"
    type: "string"
    description: "Domain controller address. Native option: -dc."
    required: false
    flag: "-dc"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
