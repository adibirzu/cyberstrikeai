name: "dotdotpwn"
command: "dotdotpwn"
enabled: true
short_description: "Test for directory traversal"
description: |
  Test for directory traversal.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool. Native option: -h."
    required: true
    flag: "-h"
    format: "flag"
  - name: "module"
    type: "string"
    description: "Native module to run. Native option: -m. Default: http."
    required: false
    flag: "-m"
    format: "flag"
    default: "http"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
