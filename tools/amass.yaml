name: "amass"
command: "amass"
enabled: true
short_description: "Enumerate subdomains and map network assets"
description: |
  Enumerate subdomains and map network assets.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "mode"
    type: "string"
    description: "Native operating mode. Allowed values: enum, intel, viz. Default: enum."
    required: false
    default: "enum"
    position: 0
    format: "positional"
    options: ["enum", "intel", "viz"]
  - name: "domain"
    type: "string"
    description: "Target domain name. Native option: -d."
    required: true
    flag: "-d"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
