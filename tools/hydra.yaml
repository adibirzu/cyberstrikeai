name: "hydra"
command: "hydra"
args: ["-I"]
enabled: true
short_description: "Test service authentication with supplied credentials or wordlists"
description: |
  Test service authentication with supplied credentials or wordlists.

  Authentication testing can lock accounts or trigger monitoring. Use the agreed credential set, rate and service scope; valid-credential detection stops early by default.
parameters:
  - name: "username"
    type: "string"
    description: "Single username (-l); provide username or username_file. Native option: -l."
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "Path to the username wordlist. Native option: -L."
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Single password (-p). Native option: -p."
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "Path to the password wordlist. Native option: -P."
    required: false
    flag: "-P"
    format: "flag"
  - name: "stop_on_first"
    type: "bool"
    description: "Stop after finding a valid credential pair (-f); enabled by default. Native option: -f. Default: true."
    required: false
    flag: "-f"
    format: "flag"
    default: true
  - name: "tasks"
    type: "int"
    description: "Parallel connections per target (-t). Keep conservative values for services prone to lockout. Native option: -t. Default: 4."
    required: false
    flag: "-t"
    format: "flag"
    default: 4
  - name: "wait_time"
    type: "int"
    description: "Connection-response timeout in seconds (-w). Native option: -w. Default: 16."
    required: false
    flag: "-w"
    format: "flag"
    default: 16
  - name: "wait_between"
    type: "int"
    description: "Delay between connections per thread in seconds (-W). Native option: -W. Default: 1."
    required: false
    flag: "-W"
    format: "flag"
    default: 1
  - name: "output_file"
    type: "string"
    description: "Path for the output file. Native option: -o."
    required: false
    flag: "-o"
    format: "flag"
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool."
    required: true
    position: 1
    format: "positional"
  - name: "service"
    type: "string"
    description: "Authentication service/protocol, such as ssh, ftp, http-get, http-post-form or smb."
    required: true
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
