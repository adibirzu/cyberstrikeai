name: "pwntools"
command: "python3"
args:
  - "-c"
  - |
    import os
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write('Missing script content\n')
        sys.exit(1)

    script_content = sys.argv[1]
    target_binary = sys.argv[2] if len(sys.argv) > 2 else ""
    target_host = sys.argv[3] if len(sys.argv) > 3 else ""
    target_port = sys.argv[4] if len(sys.argv) > 4 else ""
    exploit_type = sys.argv[5] if len(sys.argv) > 5 else "local"

    if target_binary:
        os.environ["PWN_BINARY"] = target_binary
    if target_host:
        os.environ["PWN_HOST"] = target_host
    if target_port:
        os.environ["PWN_PORT"] = str(target_port)
    if exploit_type:
        os.environ["PWN_EXPLOIT_TYPE"] = exploit_type

    exec(script_content, {})
enabled: true
short_description: "Run Python scripts using the pwntools framework"
description: |
  Run Python scripts using the pwntools framework.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "script_content"
    type: "string"
    description: "Python script content to execute."
    required: true
    position: 0
    format: "positional"
  - name: "target_binary"
    type: "string"
    description: "Local binary path exposed as PWN_BINARY. Default: ."
    required: false
    default: ""
    position: 1
    format: "positional"
  - name: "target_host"
    type: "string"
    description: "Host exposed as PWN_HOST. Default: ."
    required: false
    default: ""
    position: 2
    format: "positional"
  - name: "target_port"
    type: "string"
    description: "Port exposed as PWN_PORT. Default: ."
    required: false
    default: ""
    position: 3
    format: "positional"
  - name: "exploit_type"
    type: "string"
    description: "Label exposed as PWN_EXPLOIT_TYPE. Default: local."
    required: false
    default: "local"
    position: 4
    format: "positional"
