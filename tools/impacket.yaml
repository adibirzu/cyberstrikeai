name: "impacket"
command: "python3"
args:
  - "-c"
  - |
    import json
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write('Missing Impacket script path\n')
        sys.exit(1)

    script_path = sys.argv[1]
    args_raw = sys.argv[2] if len(sys.argv) > 2 else ""
    extra = sys.argv[3] if len(sys.argv) > 3 else ""

    cmd = [script_path]

    if args_raw:
        parsed = []
        try:
            candidate = json.loads(args_raw)
            if isinstance(candidate, list):
                parsed = [str(item) for item in candidate]
            elif isinstance(candidate, str):
                parsed = shlex.split(candidate)
        except (json.JSONDecodeError, ValueError):
            parsed = shlex.split(args_raw)
        cmd.extend(parsed)

    if extra:
        cmd.extend(shlex.split(extra))

    proc = subprocess.run(cmd, capture_output=True, text=True)
    if proc.stdout:
        sys.stdout.write(proc.stdout)
    if proc.stderr:
        sys.stderr.write(proc.stderr)
    sys.exit(proc.returncode)
enabled: true
short_description: "Run Impacket network-protocol tools"
description: |
  Run Impacket network-protocol tools.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "script"
    type: "string"
    description: "Script name, path or content required by this tool."
    required: true
    position: 0
    format: "positional"
  - name: "args"
    type: "string"
    description: "Script arguments as a JSON array or space-separated string. Default: ."
    required: false
    default: ""
    position: 1
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe. Default: ."
    required: false
    default: ""
    position: 2
    format: "positional"
