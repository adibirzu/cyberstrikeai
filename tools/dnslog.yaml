name: "dnslog"
command: "python3"
args:
  - "-c"
  - |
    import hashlib
    import json
    import os
    import pathlib
    import stat
    import sys
    import time
    from urllib.parse import urlparse

    import requests


    def fail(message):
        print(json.dumps({"status": "error", "message": message}))
        raise SystemExit(1)


    if len(sys.argv) < 2:
        fail("operation is required: get_domain or get_records")
    operation = sys.argv[1]
    base_url = os.environ.get("DNSLOG_BASE_URL", "http://dnslog.cn").rstrip("/")
    parsed = urlparse(base_url)
    if parsed.scheme not in ("http", "https") or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
        fail("DNSLOG_BASE_URL must be an HTTP(S) service URL without credentials, query or fragment")
    root = pathlib.Path(os.environ.get("DNSLOG_SESSION_DIR", str(pathlib.Path.home() / ".local/state/cyberstrikeai/dnslog")))
    root.mkdir(mode=0o700, parents=True, exist_ok=True)
    info = root.lstat()
    if root.is_symlink() or not stat.S_ISDIR(info.st_mode) or (os.name != "nt" and info.st_mode & 0o077) or (hasattr(os, "getuid") and info.st_uid != os.getuid()):
        fail("DNSlog session directory must be a private directory owned by the current user")


    def session_path(domain):
        return root / (hashlib.sha256(domain.encode("utf-8")).hexdigest() + ".json")


    def load_cookie(domain):
        path = session_path(domain)
        try:
            fd = os.open(path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
            with os.fdopen(fd) as file:
                info = os.fstat(file.fileno())
                if not stat.S_ISREG(info.st_mode) or (os.name != "nt" and info.st_mode & 0o077) or (hasattr(os, "getuid") and info.st_uid != os.getuid()):
                    fail("DNSlog session file is not private or not owned by the current user")
                if info.st_size > 65536:
                    fail("DNSlog session file exceeds the size limit")
                return json.load(file)
        except FileNotFoundError:
            fail("No local session for this domain; obtain a domain with get_domain first")


    session = requests.Session()
    try:
        if operation == "get_domain":
            response = session.get(base_url + "/getdomain.php", timeout=10)
            response.raise_for_status()
            domain = response.text.strip().rstrip("%")
            if not domain or len(domain) > 253 or any(c not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-" for c in domain):
                fail("Callback service returned an invalid domain")
            path = session_path(domain)
            # New domains receive distinct files. Never follow or replace an existing
            # session or symlink, even when an external service repeats a domain.
            fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0), 0o600)
            with os.fdopen(fd, "w") as file:
                json.dump(session.cookies.get_dict(), file)
            print(json.dumps({"status": "success", "domain": domain,
                              "message": "Callback domain obtained",
                              "usage": "Use the domain only for explicitly authorized callback tests, then query get_records"}, indent=2))
        elif operation == "get_records":
            if len(sys.argv) < 3 or not sys.argv[2].strip():
                fail("domain is required for get_records")
            domain = sys.argv[2].strip()
            session.cookies.update(load_cookie(domain))
            wait = float(sys.argv[3]) if len(sys.argv) > 3 else 0
            if wait < 0:
                fail("wait_time must be nonnegative")
            if wait:
                time.sleep(wait)
            response = session.get(base_url + "/getrecords.php", params={"t": domain}, timeout=10)
            response.raise_for_status()
            text = response.text.strip().rstrip("%")
            try:
                records = json.loads(text) if text else []
            except json.JSONDecodeError:
                records = [line.strip() for line in text.splitlines() if line.strip() and line.strip() != "[]"]
            if not isinstance(records, list):
                fail("Callback service returned an unexpected record format")
            result = {"status": "success" if records else "no_records", "domain": domain,
                      "records": records, "message": "DNS callback records retrieved" if records else "No DNS callback records yet"}
            if records:
                result["record_count"] = len(records)
            print(json.dumps(result, indent=2))
        else:
            fail("Unknown operation; use get_domain or get_records")
    except requests.RequestException as error:
        fail("Callback request failed: " + str(error))
    except Exception as error:
        fail("DNSlog operation failed: " + str(error))
enabled: false
short_description: "Obtain and query DNS callback records for out-of-band validation"
description: |
  Obtain and query DNS callback records for out-of-band validation.

  Uses the external dnslog.cn callback service. The bundled recipe currently communicates over plaintext HTTP and stores each session cookie in a private per-domain file. This can expose callback/session data; use only when that external service and data disclosure are explicitly acceptable. Do not put secrets or customer data into callback labels.
parameters:
  - name: "operation"
    type: "string"
    description: "Operation to perform."
    required: true
    position: 0
    format: "positional"
  - name: "domain"
    type: "string"
    description: "Target domain name."
    required: false
    position: 1
    format: "positional"
  - name: "wait_time"
    type: "int"
    description: "Seconds to wait before retrieving callback records. Default: 0."
    required: false
    position: 2
    format: "positional"
    default: 0
