name: "dnsenum"
command: "dnsenum"
enabled: true
short_description: "Enumerate DNS records and subdomains"
description: |
  Enumerate DNS records and subdomains.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name."
    required: true
    position: 0
    format: "positional"
  - name: "dns_server"
    type: "string"
    description: "DNS server address. Native option: -n."
    required: false
    flag: "-n"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Path to the wordlist file. Native option: -f."
    required: false
    flag: "-f"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
