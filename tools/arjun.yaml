name: "arjun"
command: "arjun"
enabled: true
short_description: "Discover HTTP request parameters"
description: |
  Discover HTTP request parameters.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "url"
    type: "string"
    description: "Target URL. Native option: -u."
    required: true
    flag: "-u"
    format: "flag"
  - name: "method"
    type: "string"
    description: "HTTP request method. Native option: -m. Default: get."
    required: false
    flag: "-m"
    format: "flag"
    default: "GET"
  - name: "wordlist"
    type: "string"
    description: "Path to the wordlist file. Native option: -w."
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of concurrent worker threads. Native option: -t. Default: 25."
    required: false
    flag: "-t"
    format: "flag"
    default: 25
  - name: "stable"
    type: "bool"
    description: "Enable stable parameter-discovery mode. Native option: --stable. Default: false."
    required: false
    flag: "--stable"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
