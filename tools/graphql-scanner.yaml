name: "graphql-scanner"
command: "graphqlmap"
enabled: true
short_description: "Assess GraphQL endpoints, introspection and query limits"
description: |
  Assess GraphQL endpoints, introspection and query limits.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "endpoint"
    type: "string"
    description: "Target endpoint URL. Native option: -u."
    required: true
    flag: "-u"
    format: "flag"
  - name: "introspection"
    type: "bool"
    description: "Test GraphQL introspection. Native option: --introspection. Default: true."
    required: false
    default: true
    flag: "--introspection"
    format: "flag"
  - name: "query_depth"
    type: "int"
    description: "Maximum GraphQL query depth to test. Native option: --depth. Default: 10."
    required: false
    default: 10
    flag: "--depth"
    format: "flag"
  - name: "test_mutations"
    type: "bool"
    description: "Test GraphQL mutations; these may change target state. Native option: --mutations. Default: true."
    required: false
    default: true
    flag: "--mutations"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
