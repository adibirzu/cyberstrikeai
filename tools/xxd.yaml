name: "xxd"
command: "xxd"
enabled: true
short_description: "Inspect file bytes as hexadecimal output"
description: |
  Inspect file bytes as hexadecimal output.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the input file."
    required: true
    position: 0
    format: "positional"
  - name: "offset"
    type: "string"
    description: "Starting byte offset. Native option: -s. Default: 0."
    required: false
    flag: "-s"
    format: "flag"
    default: "0"
  - name: "length"
    type: "string"
    description: "Number of bytes to read. Native option: -l."
    required: false
    flag: "-l"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
