name: "fierce"
command: "fierce"
enabled: true
short_description: "Perform DNS reconnaissance"
description: |
  Perform DNS reconnaissance.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name. Native option: -dns."
    required: true
    flag: "-dns"
    format: "flag"
  - name: "dns_server"
    type: "string"
    description: "DNS server address. Native option: -dnsserver."
    required: false
    flag: "-dnsserver"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
