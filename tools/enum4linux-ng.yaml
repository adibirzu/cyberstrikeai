name: "enum4linux-ng"
command: "enum4linux-ng"
enabled: true
short_description: "Enumerate SMB hosts, users, groups, shares and policy"
description: |
  Enumerate SMB hosts, users, groups, shares and policy.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool."
    required: true
    position: 0
    format: "positional"
  - name: "username"
    type: "string"
    description: "Username to use. Native option: -u."
    required: false
    flag: "-u"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Password to use. Native option: -p."
    required: false
    flag: "-p"
    format: "flag"
  - name: "domain"
    type: "string"
    description: "Target domain name. Native option: -d."
    required: false
    flag: "-d"
    format: "flag"
  - name: "shares"
    type: "bool"
    description: "Enumerate shares. Native option: -S. Default: true."
    required: false
    flag: "-S"
    format: "flag"
    default: true
  - name: "users"
    type: "bool"
    description: "Enumerate users. Native option: -U. Default: true."
    required: false
    flag: "-U"
    format: "flag"
    default: true
  - name: "groups"
    type: "bool"
    description: "Enumerate groups. Native option: -G. Default: true."
    required: false
    flag: "-G"
    format: "flag"
    default: true
  - name: "policy"
    type: "bool"
    description: "Enumerate security policy. Native option: -P. Default: true."
    required: false
    flag: "-P"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
