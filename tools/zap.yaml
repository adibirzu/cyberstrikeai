name: "zap"
command: "zap-cli"
enabled: false
short_description: "Scan web applications with OWASP ZAP"
description: |
  Scan web applications with OWASP ZAP.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool. Native option: -t."
    required: true
    flag: "-t"
    format: "flag"
  - name: "scan_type"
    type: "string"
    description: "Native scan mode. Native option: --scan-type. Default: baseline."
    required: false
    flag: "--scan-type"
    format: "flag"
    default: "baseline"
  - name: "api_key"
    type: "string"
    description: "API credential for this tool or service. Native option: --api-key."
    required: false
    flag: "--api-key"
    format: "flag"
  - name: "daemon"
    type: "bool"
    description: "Run the service in daemon mode. Native option: --daemon. Default: false."
    required: false
    flag: "--daemon"
    format: "flag"
    default: false
  - name: "port"
    type: "string"
    description: "Service port. Native option: --port. Default: 8090."
    required: false
    flag: "--port"
    format: "flag"
    default: "8090"
  - name: "format_type"
    type: "string"
    description: "Output or data format. Native option: --format. Default: xml."
    required: false
    flag: "--format"
    format: "flag"
    default: "xml"
  - name: "output_file"
    type: "string"
    description: "Path for the output file. Native option: --output."
    required: false
    flag: "--output"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
