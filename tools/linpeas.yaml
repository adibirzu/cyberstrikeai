name: "linpeas"
command: "linpeas.sh"
enabled: true
short_description: "Enumerate Linux privilege-escalation conditions"
description: |
  Enumerate Linux privilege-escalation conditions.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "output"
    type: "string"
    description: "Output file path. Native option: -o."
    required: false
    flag: "-o"
    format: "flag"
  - name: "fast"
    type: "bool"
    description: "Use fast mode and skip time-consuming checks. Native option: -fast."
    required: false
    flag: "-fast"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
