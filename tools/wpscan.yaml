name: "wpscan"
command: "wpscan"
enabled: true
# 允许的退出码列表：wpscan在目标不是WordPress站点时会返回退出码4，这是正常的信息性输出
allowed_exit_codes: [4]
short_description: "Assess WordPress installations for known security issues"
description: |
  Assess WordPress installations for known security issues.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "url"
    type: "string"
    description: "Target URL. Native option: --url."
    required: true
    flag: "--url"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
