name: "nmap"
command: "nmap"
# 默认：TCP 连接扫描 + 版本检测 + 默认 NSE 脚本（无 root 也可用）
args: ["-sT", "-sV", "-sC"]
enabled: true
short_description: "Discover ports, service versions and NSE script results"
description: |
  Discover ports, service versions and NSE script results.

  Defaults to -sT -sV -sC: TCP connect scanning, version detection and default NSE scripts. This default does not require root. scan_type replaces that whole default option set. -O, -A and SYN scanning require the appropriate OS privileges. Start with a limited port set when appropriate.
parameters:
  - name: "target"
    type: "string"
    description: "Target IP, hostname, domain or CIDR. A URL is reduced to its host."
    required: true
    position: 1
    format: "positional"
  - name: "ports"
    type: "string"
    description: "Port list/range, for example 80,443 or 1-1000. A full 1-65535 scan can be slow. Native option: -p."
    required: false
    flag: "-p"
    format: "flag"
  - name: "timing"
    type: "string"
    description: "Timing template 0-5; larger values are faster. For example, 4 produces -T4."
    required: false
    format: "template"
    template: "-T{value}"
  - name: "nse_scripts"
    type: "string"
    description: "NSE script names/patterns passed to --script, for example vuln or http-title,http-headers. Native option: --script."
    required: false
    flag: "--script"
    format: "flag"
  - name: "os_detection"
    type: "bool"
    description: "Enable -O operating-system detection. Requires root; leave false without root. Native option: -O. Default: false."
    required: false
    flag: "-O"
    format: "flag"
    default: false
  - name: "aggressive"
    type: "bool"
    description: "Enable -A, including operating-system detection. Requires root; leave false without root. Native option: -A. Default: false."
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "scan_type"
    type: "string"
    description: "Space-separated scan options replacing the complete default -sT -sV -sC set. Include every option you need. SYN/UDP scans may require root."
    required: false
    format: "template"
    template: "{value}"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
