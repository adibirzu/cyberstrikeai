name: "hashcat"
command: "hashcat"
enabled: true
short_description: "Test password hashes with Hashcat attack modes"
description: |
  Test password hashes with Hashcat attack modes.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "hash_file"
    type: "string"
    description: "Path to the file containing password hashes."
    required: true
    position: 0
    format: "positional"
  - name: "hash_type"
    type: "string"
    description: "Hashcat hash-type number. Native option: -m."
    required: true
    flag: "-m"
    format: "flag"
  - name: "attack_mode"
    type: "string"
    description: "Native attack-mode number. Native option: -a. Default: 0."
    required: false
    default: "0"
    flag: "-a"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Path to the wordlist file. Default: /usr/share/wordlists/rockyou.txt."
    required: false
    default: "/usr/share/wordlists/rockyou.txt"
    position: 1
    format: "positional"
  - name: "mask"
    type: "string"
    description: "Mask used by a mask-based password test."
    required: false
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
