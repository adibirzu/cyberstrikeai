name: "ffuf"
command: "ffuf"
enabled: true
short_description: "Fuzz web content, paths and parameters"
description: |
  Fuzz web content, paths and parameters.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "url"
    type: "string"
    description: "Target URL. Native option: -u."
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Path to the wordlist file. Native option: -w. Default: /usr/share/wordlists/dirb/common.txt."
    required: false
    default: "/usr/share/wordlists/dirb/common.txt"
    flag: "-w"
    format: "flag"
  - name: "match_codes"
    type: "string"
    description: "Comma-separated HTTP status codes to match. Native option: -mc. Default: 200,204,301,302,307,401,403."
    required: false
    default: "200,204,301,302,307,401,403"
    flag: "-mc"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
