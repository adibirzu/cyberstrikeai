name: "hashpump"
command: "hashpump"
enabled: true
short_description: "Construct hash length-extension test inputs"
description: |
  Construct hash length-extension test inputs.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "signature"
    type: "string"
    description: "Original hash signature. Native option: -s."
    required: true
    flag: "-s"
    format: "flag"
  - name: "data"
    type: "string"
    description: "Request body or data. Native option: -d."
    required: true
    flag: "-d"
    format: "flag"
  - name: "key_length"
    type: "int"
    description: "Length of the secret key in bytes. Native option: -k."
    required: true
    flag: "-k"
    format: "flag"
  - name: "append_data"
    type: "string"
    description: "Data to append in the length-extension test. Native option: -a."
    required: true
    flag: "-a"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
