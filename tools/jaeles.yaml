name: "jaeles"
command: "jaeles"
args: ["scan"]
enabled: true
short_description: "Run web security checks from Jaeles signatures"
description: |
  Run web security checks from Jaeles signatures.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "url"
    type: "string"
    description: "Target URL. Native option: -u."
    required: true
    flag: "-u"
    format: "flag"
  - name: "signatures"
    type: "string"
    description: "Path to custom signature definitions. Native option: -s."
    required: false
    flag: "-s"
    format: "flag"
  - name: "config"
    type: "string"
    description: "Path to the configuration file. Native option: -c."
    required: false
    flag: "-c"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of concurrent worker threads. Native option: -t. Default: 20."
    required: false
    flag: "-t"
    format: "flag"
    default: 20
  - name: "timeout"
    type: "int"
    description: "Timeout in seconds. Native option: --timeout. Default: 20."
    required: false
    flag: "--timeout"
    format: "flag"
    default: 20
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
