name: "masscan"
command: "masscan"
enabled: true
short_description: "Perform high-speed port discovery"
description: |
  Perform high-speed port discovery.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool."
    required: true
    position: 0
    format: "positional"
  - name: "ports"
    type: "string"
    description: "Ports to scan. Native option: -p. Default: 1-65535."
    required: false
    flag: "-p"
    format: "flag"
    default: "1-65535"
  - name: "rate"
    type: "int"
    description: "Packet transmission rate per second. Native option: --rate. Default: 1000."
    required: false
    flag: "--rate"
    format: "flag"
    default: 1000
  - name: "interface"
    type: "string"
    description: "Network interface name. Native option: -e."
    required: false
    flag: "-e"
    format: "flag"
  - name: "banners"
    type: "bool"
    description: "Collect service banners. Native option: --banners. Default: false."
    required: false
    flag: "--banners"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
