name: "falco"
command: "falco"
enabled: true
short_description: "Monitor runtime activity with Falco security rules"
description: |
  Monitor runtime activity with Falco security rules.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "config_file"
    type: "string"
    description: "Path to the configuration file. Native option: --config. Default: /etc/falco/falco.yaml."
    required: false
    flag: "--config"
    format: "flag"
    default: "/etc/falco/falco.yaml"
  - name: "rules_file"
    type: "string"
    description: "Path to custom rules. Native option: --rules."
    required: false
    flag: "--rules"
    format: "flag"
  - name: "json_output"
    type: "bool"
    description: "Enable JSON output. Native option: -o json_output=true. Default: true."
    required: false
    flag: "-o json_output=true"
    format: "flag"
    default: true
  - name: "duration"
    type: "int"
    description: "Run duration in seconds. Native option: --duration. Default: 60."
    required: false
    flag: "--duration"
    format: "flag"
    default: 60
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
