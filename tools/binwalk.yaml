name: "binwalk"
command: "binwalk"
enabled: true
short_description: "Analyze firmware and embedded file signatures"
description: |
  Analyze firmware and embedded file signatures.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the input file."
    required: true
    position: 0
    format: "positional"
  - name: "extract"
    type: "bool"
    description: "Extract embedded files. Native option: -e. Default: false."
    required: false
    flag: "-e"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
