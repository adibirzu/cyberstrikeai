name: "arp-scan"
command: "arp-scan"
enabled: true
short_description: "Discover hosts on local networks with ARP"
description: |
  Discover hosts on local networks with ARP.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool."
    required: false
    position: 0
    format: "positional"
  - name: "interface"
    type: "string"
    description: "Network interface name. Native option: -I."
    required: false
    flag: "-I"
    format: "flag"
  - name: "local_network"
    type: "bool"
    description: "Discover hosts on the local network. Native option: -l. Default: false."
    required: false
    flag: "-l"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
