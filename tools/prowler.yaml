name: "prowler"
command: "prowler"
enabled: true
short_description: "Assess AWS, Azure and GCP security configuration"
description: |
  Assess AWS, Azure and GCP security configuration.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "provider"
    type: "string"
    description: "Cloud provider. Default: aws."
    required: false
    default: "aws"
    position: 0
    format: "positional"
  - name: "profile"
    type: "string"
    description: "Cloud account profile name. Native option: -p. Default: default."
    required: false
    flag: "-p"
    format: "flag"
    default: "default"
  - name: "region"
    type: "string"
    description: "Cloud region. Native option: -r."
    required: false
    flag: "-r"
    format: "flag"
  - name: "checks"
    type: "string"
    description: "Checks to run. Native option: -c."
    required: false
    flag: "-c"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format. Native option: -M. Default: json."
    required: false
    flag: "-M"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
