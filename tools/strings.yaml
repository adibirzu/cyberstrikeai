name: "strings"
command: "strings"
enabled: true
short_description: "Extract printable strings from files"
description: |
  Extract printable strings from files.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the input file."
    required: true
    position: 0
    format: "positional"
  - name: "min_len"
    type: "int"
    description: "Minimum printable-string length. Native option: -n. Default: 4."
    required: false
    flag: "-n"
    format: "flag"
    default: 4
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
