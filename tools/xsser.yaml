name: "xsser"
command: "xsser"
enabled: true
short_description: "Test web application inputs for XSS"
description: |
  Test web application inputs for XSS.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "url"
    type: "string"
    description: "Target URL. Native option: --url."
    required: true
    flag: "--url"
    format: "flag"
  - name: "params"
    type: "string"
    description: "Parameters to test. Native option: --Fp."
    required: false
    flag: "--Fp"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
