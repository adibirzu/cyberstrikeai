name: "zsteg"
command: "zsteg"
enabled: true
short_description: "Detect LSB steganography in PNG and BMP files"
description: |
  Detect LSB steganography in PNG and BMP files.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "file"
    type: "string"
    description: "Path to the input image file."
    required: true
    position: 0
    format: "positional"
  - name: "all"
    type: "bool"
    description: "Test all supported steganography methods. Native option: --all."
    required: false
    flag: "--all"
    format: "flag"
  - name: "lsb"
    type: "bool"
    description: "Test least-significant-bit steganography. Native option: --lsb."
    required: false
    flag: "--lsb"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
