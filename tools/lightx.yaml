name: "lightx"
command: "lightx"
enabled: false
short_description: "Discover assets and run lightweight vulnerability checks"
description: |
  Discover assets and run lightweight vulnerability checks.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool. Native option: -t."
    required: true
    flag: "-t"
    format: "flag"
