name: "kube-bench"
command: "kube-bench"
enabled: true
short_description: "Check Kubernetes configuration against CIS benchmarks"
description: |
  Check Kubernetes configuration against CIS benchmarks.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "targets"
    type: "string"
    description: "Benchmark components to check, such as master, node, etcd or policies. Native option: --targets."
    required: false
    flag: "--targets"
    format: "flag"
  - name: "version"
    type: "string"
    description: "Target product or benchmark version. Native option: --version."
    required: false
    flag: "--version"
    format: "flag"
  - name: "config_dir"
    type: "string"
    description: "Configuration directory. Native option: --config-dir."
    required: false
    flag: "--config-dir"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format. Native option: --output. Default: json."
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
