name: "nbtscan"
command: "nbtscan"
enabled: true
short_description: "Discover NetBIOS names and host information"
description: |
  Discover NetBIOS names and host information.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool."
    required: true
    position: 0
    format: "positional"
  - name: "verbose"
    type: "bool"
    description: "Enable detailed output. Native option: -v. Default: false."
    required: false
    flag: "-v"
    format: "flag"
    default: false
  - name: "timeout"
    type: "int"
    description: "Timeout in seconds. Native option: -t. Default: 2."
    required: false
    flag: "-t"
    format: "flag"
    default: 2
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
