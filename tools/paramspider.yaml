name: "paramspider"
command: "paramspider"
enabled: true
short_description: "Collect parameterized URLs from web archives"
description: |
  Collect parameterized URLs from web archives.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name. Native option: -d."
    required: true
    flag: "-d"
    format: "flag"
  - name: "level"
    type: "int"
    description: "Native test or analysis level. Native option: -l. Default: 2."
    required: false
    flag: "-l"
    format: "flag"
    default: 2
  - name: "exclude"
    type: "string"
    description: "File extensions or patterns to exclude. Native option: -e."
    required: false
    flag: "-e"
    format: "flag"
  - name: "output"
    type: "string"
    description: "Output file path. Native option: -o."
    required: false
    flag: "-o"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
