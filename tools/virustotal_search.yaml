name: "virustotal_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import requests
    import os
    import time

    # ==================== VirusTotal 配置 ====================
    # 请在此处配置您的 VirusTotal API 密钥
    # 您也可以在环境变量中设置：VT_API_KEY
    # enable 默认为 false，需开启才能调用该MCP
    VT_API_KEY = ""  # 请填写您的 VirusTotal API 密钥
    # =======================================================

    # VirusTotal API 基础 URL
    BASE_URL = "https://www.virustotal.com/api/v3"

    def parse_args():
        'Parse command-line parameters.'
        # 尝试从第一个参数读取 JSON 配置
        if len(sys.argv) > 1:
            try:
                arg1 = str(sys.argv[1])
                config = json.loads(arg1)
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                pass

        # 传统位置参数方式
        config = {}
        if len(sys.argv) > 1:
            config['domain'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['limit'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            config['include_ips'] = sys.argv[3].lower() in ('true', '1', 'yes')
        return config

    def query_virustotal_subdomains(domain, api_key, limit=100, include_ips=False):
        '\n    Query VirusTotal subdomain information\n    \n    Args:\n        domain: Domain name to query\n        api_key: VirusTotal API Key\n        limit: Number of returns\n        include_ips: Whether to include IP addresses\n    \n    Returns:\n        dict: Dictionary containing query results\n    '
        # 构建 API 请求 URL
        url = f"{BASE_URL}/domains/{domain}/subdomains"

        headers = {
            "x-apikey": api_key,
            "accept": "application/json"
        }

        params = {
            "limit": min(limit, 40)  # API 限制最大 40
        }

        all_results = []
        next_url = None

        try:
            # 处理分页
            while True:
                if next_url:
                    response = requests.get(next_url, headers=headers, timeout=30)
                else:
                    response = requests.get(url, headers=headers, params=params, timeout=30)

                response.raise_for_status()
                data = response.json()

                # 提取子域名数据
                if 'data' in data and data['data']:
                    for item in data['data']:
                        if 'id' in item:
                            subdomain_info = {
                                'subdomain': item['id'],
                                'type': item.get('type', 'domain'),
                            }

                            # 如果 include_ips 为 True，尝试获取解析 IP
                            if include_ips and 'attributes' in item:
                                attributes = item.get('attributes', {})
                                # 这里简化处理，实际可能需要额外的 API 调用
                                subdomain_info['last_dns_records'] = attributes.get('last_dns_records', [])

                            all_results.append(subdomain_info)

                    # 检查是否有下一页
                    if 'links' in data and 'next' in data['links'] and len(all_results) < limit:
                        next_url = data['links']['next']
                        # 避免请求过快
                        time.sleep(0.5)
                    else:
                        break
                else:
                    break

                # 如果已达到限制，停止获取
                if len(all_results) >= limit:
                    break

            # 处理返回结果
            if all_results:
                return {
                    "status": "success",
                    "domain": domain,
                    "total_found": len(all_results),
                    "results": all_results[:limit],
                    "message": f"Retrieved {len(all_results[:limit])} subdomains"
                }
            else:
                return {
                    "status": "success",
                    "domain": domain,
                    "total_found": 0,
                    "results": [],
                    "message": f"No subdomains found for {domain}"
                }

        except requests.exceptions.RequestException as e:
            error_msg = str(e)
            error_result = {
                "status": "error",
                "message": f"API Request Failed: {error_msg}",
                "suggestion": 'Check the network connection, API key and VirusTotal service availability.'
            }

            # 处理特定 HTTP 状态码
            if hasattr(e, 'response') and e.response:
                status_code = e.response.status_code
                if status_code == 401:
                    error_result["message"] = 'Invalid or unauthorized API key'
                    error_result["suggestion"] = 'Check the VirusTotal API key or obtain a valid key from https://www.virustotal.com/'
                elif status_code == 429:
                    error_result["message"] = 'API rate limit exceeded'
                    error_result["suggestion"] = 'Retry later and observe the rate limit for your VirusTotal account plan.'
                elif status_code == 404:
                    error_result["message"] = f"Domain \'{domain}\' does not exist or was not found"

            return error_result

    try:
        config = parse_args()

        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Invalid parameters: expected an object, got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # 获取 API 密钥（从配置或环境变量）
        api_key = os.getenv('VT_API_KEY', VT_API_KEY).strip()

        if not api_key:
            error_result = {
                "status": "error",
                "message": 'Missing VirusTotal API key',
                "required_config": ["VT_API_KEY"],
                "note": "Set VT_API_KEY in this recipe or its explicitly configured child environment. Register for a key at https://www.virustotal.com/"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # 获取必需参数
        domain = config.get('domain', '').strip()
        if not domain:
            error_result = {
                "status": "error",
                "message": 'Missing required parameter: domain',
                "required_params": ["domain"],
                "examples": [
                    "example.com",
                    "google.com",
                    "baidu.com"
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # 获取可选参数
        limit = config.get('limit', 100)
        try:
            limit = int(limit)
            if limit < 1:
                limit = 100
            elif limit > 1000:
                limit = 1000  # 限制最大 1000
        except (ValueError, TypeError):
            limit = 100

        include_ips = config.get('include_ips', False)
        if isinstance(include_ips, str):
            include_ips = include_ips.lower() in ('true', '1', 'yes')

        # 执行查询
        result = query_virustotal_subdomains(domain, api_key, limit, include_ips)

        # 输出结果
        print(json.dumps(result, ensure_ascii=False, indent=2))

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution failed: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
