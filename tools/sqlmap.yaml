name: "sqlmap"
command: "sqlmap"
enabled: true
# 简短描述（用于工具列表，减少token消耗）
short_description: "Test for and validate SQL injection"
# 工具详细描述
description: |
  Test for and validate SQL injection.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
# 参数定义
parameters:
  - name: "url"
    type: "string"
    description: "Target URL. Native option: -u."
    required: true
    flag: "-u"
    format: "flag"
  - name: "batch"
    type: "bool"
    description: "Use non-interactive mode and accept native default answers. Native option: --batch. Default: true."
    required: false
    default: true
    flag: "--batch"
    format: "flag"
  - name: "level"
    type: "int"
    description: "Native test or analysis level. Native option: --level. Default: 3."
    required: false
    default: 3
    flag: "--level"
    format: "combined" # --level=3
  - name: "data"
    type: "string"
    description: "Request body or data. Native option: --data."
    required: false
    flag: "--data"
    format: "flag"
  - name: "cookie"
    type: "string"
    description: "HTTP Cookie header value. Native option: --cookie."
    required: false
    flag: "--cookie"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
