name: "msfvenom"
command: "msfvenom"
enabled: true
short_description: "Generate and encode Metasploit payloads"
description: |
  Generate and encode Metasploit payloads.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "payload"
    type: "string"
    description: "Payload identifier. Native option: -p."
    required: true
    flag: "-p"
    format: "flag"
  - name: "format_type"
    type: "string"
    description: "Output or data format. Native option: -f."
    required: false
    flag: "-f"
    format: "flag"
  - name: "output_file"
    type: "string"
    description: "Path for the output file. Native option: -o."
    required: false
    flag: "-o"
    format: "flag"
  - name: "encoder"
    type: "string"
    description: "Encoder identifier. Native option: -e."
    required: false
    flag: "-e"
    format: "flag"
  - name: "iterations"
    type: "string"
    description: "Number of encoding iterations. Native option: -i."
    required: false
    flag: "-i"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
