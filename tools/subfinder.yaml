name: "subfinder"
command: "subfinder"
enabled: true
short_description: "Discover subdomains from passive data sources"
description: |
  Discover subdomains from passive data sources.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name. Native option: -d."
    required: true
    flag: "-d"
    format: "flag"
  - name: "silent"
    type: "bool"
    description: "Suppress non-result output. Native option: -silent. Default: true."
    required: false
    default: true
    flag: "-silent"
    format: "flag"
  - name: "all_sources"
    type: "bool"
    description: "Use all supported passive data sources. Native option: -all. Default: false."
    required: false
    default: false
    flag: "-all"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
