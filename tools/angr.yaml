name: "angr"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write('Missing script content\n')
        sys.exit(1)

    script_content = sys.argv[1]
    binary = sys.argv[2] if len(sys.argv) > 2 else ""
    find_address = sys.argv[3] if len(sys.argv) > 3 else ""
    avoid_addresses = sys.argv[4] if len(sys.argv) > 4 else ""
    analysis_type = sys.argv[5] if len(sys.argv) > 5 else ""
    extra = sys.argv[6] if len(sys.argv) > 6 else ""

    context = {
        "binary_path": binary,
        "find_address": find_address,
        "avoid_addresses": [addr.strip() for addr in avoid_addresses.split(",") if addr.strip()],
        "analysis_type": analysis_type or "symbolic",
    }

    if extra:
        context["additional_args"] = shlex.split(extra)
    else:
        context["additional_args"] = []

    # 执行用户脚本，提供上下文变量
    exec(script_content, context)
enabled: true
short_description: "Run Python-based symbolic execution and binary analysis with angr"
description: |
  Run Python-based symbolic execution and binary analysis with angr.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "script_content"
    type: "string"
    description: "Python script content to execute."
    required: true
    position: 0
    format: "positional"
  - name: "binary"
    type: "string"
    description: "Binary path exposed to the script as binary. Default: ."
    required: false
    default: ""
    position: 1
    format: "positional"
  - name: "find_address"
    type: "string"
    description: "Optional target address exposed as find_address. Default: ."
    required: false
    default: ""
    position: 2
    format: "positional"
  - name: "avoid_addresses"
    type: "string"
    description: "Comma-separated addresses exposed as avoid_addresses. Default: ."
    required: false
    default: ""
    position: 3
    format: "positional"
  - name: "analysis_type"
    type: "string"
    description: "Analysis label available to custom script branches. Default: symbolic."
    required: false
    default: "symbolic"
    position: 4
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional values available to the Python script through its additional_args list. Default: ."
    required: false
    default: ""
    position: 5
    format: "positional"
