name: "nuclei"
command: "nuclei"
enabled: true
short_description: "Run template-based vulnerability checks"
description: |
  Run template-based vulnerability checks.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool. Native option: -u."
    required: true
    flag: "-u"
    format: "flag"
  - name: "severity"
    type: "string"
    description: "Severity filter. Native option: -s."
    required: false
    flag: "-s"
    format: "flag"
  - name: "tags"
    type: "string"
    description: "Tags to select. Native option: -tags."
    required: false
    flag: "-tags"
    format: "flag"
  - name: "template"
    type: "string"
    description: "Template path or selection. Native option: -t."
    required: false
    flag: "-t"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
