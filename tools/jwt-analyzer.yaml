name: "jwt-analyzer"
command: "jwt_tool"
enabled: true
short_description: "Analyze JWT structure and test token handling"
description: |
  Analyze JWT structure and test token handling.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "jwt_token"
    type: "string"
    description: "JWT to analyze. Native option: -t."
    required: true
    flag: "-t"
    format: "flag"
  - name: "target_url"
    type: "string"
    description: "Optional target URL for testing token handling. Native option: -u."
    required: false
    flag: "-u"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
