name: "netexec"
command: "netexec"
enabled: true
short_description: "Enumerate network services and run supported NetExec modules"
description: |
  Enumerate network services and run supported NetExec modules.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "protocol"
    type: "string"
    description: "Network protocol or service type. Default: smb."
    required: false
    default: "smb"
    position: 0
    format: "positional"
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool."
    required: true
    position: 1
    format: "positional"
  - name: "username"
    type: "string"
    description: "Username to use. Native option: -u."
    required: false
    flag: "-u"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Password to use. Native option: -p."
    required: false
    flag: "-p"
    format: "flag"
  - name: "hash_value"
    type: "string"
    description: "NTLM hash for pass-the-hash testing. Native option: -H."
    required: false
    flag: "-H"
    format: "flag"
  - name: "module"
    type: "string"
    description: "Native module to run. Native option: -M."
    required: false
    flag: "-M"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
