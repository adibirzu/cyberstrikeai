name: "query_execution_result"
# 注意：这是一个内部工具，不执行外部命令
# command 字段设置为特殊值，实际功能需要在代码中实现
# 实现位置：internal/mcp/server.go 或 internal/handler/agent.go
command: "internal:query_execution_result"
enabled: true
# 简短描述（用于工具列表，减少token消耗）
short_description: "Retrieve, search and paginate stored tool execution output"
# 工具详细描述
description: |
  Retrieve, search and paginate stored tool execution output.

  Read existing tool output without rerunning the tool. Use pagination and filtering to keep large results out of the conversation context.
# 参数定义
parameters:
  - name: "execution_id"
    type: "string"
    description: "Execution ID returned by the original tool invocation."
    required: true
    format: "positional"
    position: 0

  - name: "page"
    type: "integer"
    description: "One-based output page number. Default: 1."
    required: false
    default: 1

  - name: "limit"
    type: "integer"
    description: "Maximum output records/lines to return in this page. Default: 100."
    required: false
    default: 100

  - name: "search"
    type: "string"
    description: "Return lines matching the search keyword."
    required: false

  - name: "filter"
    type: "string"
    description: "Filter returned lines by the supplied keyword."
    required: false

