name: "volatility3"
command: "volatility3"
enabled: true
short_description: "Analyze memory images with Volatility 3 plugins"
description: |
  Analyze memory images with Volatility 3 plugins.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "memory_file"
    type: "string"
    description: "Path to the memory image. Native option: -f."
    required: true
    flag: "-f"
    format: "flag"
  - name: "plugin"
    type: "string"
    description: "Plugin to run."
    required: true
    position: 0
    format: "positional"
  - name: "output_file"
    type: "string"
    description: "Path for the output file. Native option: -o."
    required: false
    flag: "-o"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
