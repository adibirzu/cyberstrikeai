name: "feroxbuster"
command: "feroxbuster"
enabled: false
short_description: "Discover web content recursively"
description: |
  Discover web content recursively.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "url"
    type: "string"
    description: "Target URL. Native option: -u."
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Path to the wordlist file. Native option: -w."
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of concurrent worker threads. Native option: -t. Default: 10."
    required: false
    flag: "-t"
    format: "flag"
    default: 10
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
