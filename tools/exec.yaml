name: "exec"
command: "sh"
args: ["-c"]
enabled: true
# 简短描述（用于工具列表，减少token消耗）
short_description: "Execute a system shell command"
# 工具详细描述
description: |
  Execute a system shell command.

  This is intentional arbitrary command execution under the service OS account, not a sandbox. Use only within the approved scope. Child environment credentials require explicit configuration or the exact-name allowlist; server credentials are not inherited by default.
# 参数定义
parameters:
  - name: "command"
    type: "string"
    description: "Complete shell command. Shell pipes, redirection and variable expansion are interpreted by the selected shell. Commands and results may be logged."
    required: true
    position: 0
    format: "positional"
  - name: "shell"
    type: "string"
    description: "Shell executable, default sh. It must be installed on the host. Default: sh."
    required: false
    default: "sh"
  - name: "workdir"
    type: "string"
    description: "Working directory for the command; omit to use the current directory."
    required: false
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
