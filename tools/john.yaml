name: "john"
command: "john"
enabled: true
short_description: "Test password hashes with John the Ripper"
description: |
  Test password hashes with John the Ripper.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "hash_file"
    type: "string"
    description: "Path to the file containing password hashes."
    required: true
    position: 0
    format: "positional"
  - name: "wordlist"
    type: "string"
    description: "Path to the wordlist file. Native option: --wordlist. Default: /usr/share/wordlists/rockyou.txt."
    required: false
    default: "/usr/share/wordlists/rockyou.txt"
    flag: "--wordlist"
    format: "flag"
  - name: "format_type"
    type: "string"
    description: "Output or data format. Native option: --format."
    required: false
    flag: "--format"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
