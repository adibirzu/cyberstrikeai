name: "objdump"
command: "objdump"
enabled: true
short_description: "Disassemble and inspect binary files"
description: |
  Disassemble and inspect binary files.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file."
    required: true
    position: 0
    format: "positional"
  - name: "disassemble"
    type: "bool"
    description: "Disassemble the binary. Native option: -d. Default: true."
    required: false
    flag: "-d"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
