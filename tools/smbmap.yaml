name: "smbmap"
command: "smbmap"
enabled: true
short_description: "Enumerate SMB shares and access permissions"
description: |
  Enumerate SMB shares and access permissions.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool. Native option: -H."
    required: true
    flag: "-H"
    format: "flag"
  - name: "username"
    type: "string"
    description: "Username to use. Native option: -u."
    required: false
    flag: "-u"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Password to use. Native option: -p."
    required: false
    flag: "-p"
    format: "flag"
  - name: "domain"
    type: "string"
    description: "Target domain name. Native option: -d."
    required: false
    flag: "-d"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
