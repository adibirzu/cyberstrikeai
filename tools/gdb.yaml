name: "gdb"
command: "gdb"
enabled: true
short_description: "Debug and inspect binaries with GDB"
description: |
  Debug and inspect binaries with GDB.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file."
    required: true
    position: 0
    format: "positional"
  - name: "commands"
    type: "string"
    description: "Native commands to execute. Native option: -ex."
    required: false
    flag: "-ex"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: "Path to a script file. Native option: -x."
    required: false
    flag: "-x"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
