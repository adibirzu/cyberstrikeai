name: "rustscan"
command: "rustscan"
enabled: true
short_description: "Discover open ports quickly, with optional Nmap scripts"
description: |
  Discover open ports quickly, with optional Nmap scripts.

  For port discovery without invoking Nmap, use scripts=none and optionally greppable=true. scripts is a string enum, not a boolean. Use ports for a comma-separated list and range for start-end notation. Default/custom script levels require the corresponding native tools.
parameters:
  # -a, --addresses
  - name: "target"
    type: "string"
    description: "Comma-separated addresses, CIDRs or hostnames, or a target-list file, passed with -a. Native option: -a."
    required: true
    flag: "-a"
    format: "flag"
  # -p, --ports；范围请用 range (-r)，勿把 1-1000 填进 ports
  - name: "ports"
    type: "string"
    description: "Comma-separated port numbers only, passed with -p. Use range for a start-end range. Native option: -p."
    required: false
    flag: "-p"
    format: "flag"
  # -r, --range（与 ports 列表二选一或按官方说明组合）
  - name: "range"
    type: "string"
    description: "Port range in start-end format, passed with -r. Native option: -r."
    required: false
    flag: "-r"
    format: "flag"
  # -u, --ulimit
  - name: "ulimit"
    type: "int"
    description: "File-descriptor limit for the scan. Native option: -u. Default: 5000."
    required: false
    flag: "-u"
    format: "flag"
    default: 5000
  # --scripts：none | default | custom（CLI 默认 default）
  - name: "scripts"
    type: "string"
    description: "String script level: none performs port discovery only; default/custom can invoke Nmap, which must be installed. Native option: --scripts. Allowed values: none, default, custom. Default: none."
    required: false
    flag: "--scripts"
    format: "flag"
    default: "none"
    options:
      - "none"
      - "default"
      - "custom"
  # -g, --greppable：仅端口列表，无 Nmap 输出
  - name: "greppable"
    type: "bool"
    description: "Output ports in a format suitable for text processing. Native option: -g. Default: false."
    required: false
    flag: "-g"
    format: "flag"
    default: false
  # -b, --batch-size [default: 4500]
  - name: "batch_size"
    type: "int"
    description: "Number of ports tested concurrently in each batch. Native option: -b."
    required: false
    flag: "-b"
    format: "flag"
  # -t, --timeout ms [default: 1500]
  - name: "timeout_ms"
    type: "int"
    description: "Per-port timeout in milliseconds. Native option: -t."
    required: false
    flag: "-t"
    format: "flag"
  # --scan-order serial | random [default: serial]
  - name: "scan_order"
    type: "string"
    description: "Port scan order. Native option: --scan-order. Allowed values: serial, random."
    required: false
    flag: "--scan-order"
    format: "flag"
    options:
      - "serial"
      - "random"
  # --top：top 1000 端口
  - name: "top_ports"
    type: "bool"
    description: "Select the built-in top-ports list. Native option: --top. Default: false."
    required: false
    flag: "--top"
    format: "flag"
    default: false
  # -e, --exclude-ports
  - name: "exclude_ports"
    type: "string"
    description: "Comma-separated ports to exclude. Native option: -e."
    required: false
    flag: "-e"
    format: "flag"
  # -x, --exclude-addresses
  - name: "exclude_addresses"
    type: "string"
    description: "Comma-separated addresses or networks to exclude. Native option: -x."
    required: false
    flag: "-x"
    format: "flag"
  # --tries [default: 1]
  - name: "tries"
    type: "int"
    description: "Number of retries/attempts accepted by the native CLI; this recipe maps 0 to 1. Native option: --tries."
    required: false
    flag: "--tries"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
