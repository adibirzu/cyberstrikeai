name: "checkov"
command: "checkov"
enabled: true
short_description: "Scan infrastructure-as-code configuration with Checkov"
description: |
  Scan infrastructure-as-code configuration with Checkov.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "directory"
    type: "string"
    description: "Directory to scan. Native option: -d. Default: .."
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "framework"
    type: "string"
    description: "Infrastructure framework selection. Native option: --framework."
    required: false
    flag: "--framework"
    format: "flag"
  - name: "check"
    type: "string"
    description: "Check identifiers to run. Native option: --check."
    required: false
    flag: "--check"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format. Native option: --output. Default: json."
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
