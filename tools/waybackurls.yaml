name: "waybackurls"
command: "waybackurls"
enabled: true
short_description: "Collect historical URLs from the Wayback Machine"
description: |
  Collect historical URLs from the Wayback Machine.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name."
    required: true
    position: 0
    format: "positional"
  - name: "get_versions"
    type: "bool"
    description: "Retrieve all available URL versions. Native option: -get-versions. Default: false."
    required: false
    flag: "-get-versions"
    format: "flag"
    default: false
  - name: "no_subs"
    type: "bool"
    description: "Exclude subdomains. Native option: -no-subs. Default: false."
    required: false
    flag: "-no-subs"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
