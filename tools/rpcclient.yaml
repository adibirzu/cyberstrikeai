name: "rpcclient"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write('Missing target address\n')
        sys.exit(1)

    target = sys.argv[1]
    username = sys.argv[2] if len(sys.argv) > 2 else ""
    password = sys.argv[3] if len(sys.argv) > 3 else ""
    domain = sys.argv[4] if len(sys.argv) > 4 else ""
    commands = sys.argv[5] if len(sys.argv) > 5 else ""
    extra = sys.argv[6] if len(sys.argv) > 6 else ""

    cmd = ["rpcclient"]

    if username:
        cred = username
        if password:
            cred = f"{username}%{password}"
        cmd.extend(["-U", cred])
    elif password:
        # 如果只提供了密码，仍然尝试以空用户名连接
        cmd.extend(["-U", f"%{password}"])

    if domain:
        cmd.extend(["-W", domain])

    if commands:
        cmd.extend(["-c", commands])

    if extra:
        cmd.extend(shlex.split(extra))

    cmd.append(target)

    proc = subprocess.run(cmd, capture_output=True, text=True)
    if proc.stdout:
        sys.stdout.write(proc.stdout)
    if proc.stderr:
        sys.stderr.write(proc.stderr)
    sys.exit(proc.returncode)
enabled: true
short_description: "Query RPC services and run selected RPC commands"
description: |
  Query RPC services and run selected RPC commands.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "target"
    type: "string"
    description: "Target host, address or resource accepted by this tool."
    required: true
    position: 0
    format: "positional"
  - name: "username"
    type: "string"
    description: "Username to use. Default: ."
    required: false
    default: ""
    position: 1
    format: "positional"
  - name: "password"
    type: "string"
    description: "Password to use. Default: ."
    required: false
    default: ""
    position: 2
    format: "positional"
  - name: "domain"
    type: "string"
    description: "Target domain name. Default: ."
    required: false
    default: ""
    position: 3
    format: "positional"
  - name: "commands"
    type: "string"
    description: "Native commands to execute. Default: enumdomusers;enumdomgroups;querydominfo."
    required: false
    default: "enumdomusers;enumdomgroups;querydominfo"
    position: 4
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe. Default: ."
    required: false
    default: ""
    position: 5
    format: "positional"
