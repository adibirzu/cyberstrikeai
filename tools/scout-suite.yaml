name: "scout-suite"
command: "scout"
enabled: true
short_description: "Assess cloud-account security configuration with ScoutSuite"
description: |
  Assess cloud-account security configuration with ScoutSuite.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "provider"
    type: "string"
    description: "Cloud provider. Native option: --provider. Default: aws."
    required: false
    flag: "--provider"
    format: "flag"
    default: "aws"
  - name: "profile"
    type: "string"
    description: "Cloud account profile name. Native option: --profile. Default: default."
    required: false
    flag: "--profile"
    format: "flag"
    default: "default"
  - name: "report_dir"
    type: "string"
    description: "Directory for generated reports. Native option: --report-dir. Default: /tmp/scout-suite."
    required: false
    flag: "--report-dir"
    format: "flag"
    default: "/tmp/scout-suite"
  - name: "services"
    type: "string"
    description: "Services to assess. Native option: --services."
    required: false
    flag: "--services"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
