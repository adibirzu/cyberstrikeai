name: "foremost"
command: "foremost"
enabled: true
short_description: "Recover files from images or devices"
description: |
  Recover files from images or devices.

  Use the parameters below to select the target and native options. Additional native arguments are supported where exposed by this recipe.
parameters:
  - name: "input_file"
    type: "string"
    description: "Path to the input file or device. Native option: -i."
    required: true
    flag: "-i"
    format: "flag"
  - name: "output_dir"
    type: "string"
    description: "Directory for output files. Native option: -o. Default: /tmp/foremost_output."
    required: false
    flag: "-o"
    format: "flag"
    default: "/tmp/foremost_output"
  - name: "file_types"
    type: "string"
    description: "File types to recover, such as jpg, gif or png. Native option: -t."
    required: false
    flag: "-t"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional native command-line arguments, appended according to this recipe."
    required: false
    format: "positional"
